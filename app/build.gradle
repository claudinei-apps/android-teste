plugins {
    id 'com.android.application'
}

android {
    namespace 'br.teste.android'
    compileSdk 34

    defaultConfig {
        applicationId 'br.teste.android'
        minSdk 21
        targetSdk 34
        // o número de versão sobe a cada build do GitHub, para o celular aceitar a atualização por cima
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // chave de DEBUG fixa, commitada de propósito (não é segredo: só serve para testes)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
